<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neo Mart Scanner</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<div id="permissionBox" class="box">

<h2>📷 Camera Permission</h2>

<p>
Neo Mart Scanner needs camera access
to scan product barcodes.
</p>

<button onclick="requestCamera()">
Allow Camera
</button>

</div>



<h1>🛒 Neo Mart Scanner</h1>


<video id="camera" autoplay playsinline></video>


<button id="startBtn">
Start Scanner
</button>



<p id="status">
Waiting for permission...
</p>




<div id="itemInfo" class="hidden">


<h2>Product Information</h2>


<p>
Barcode:
<span id="barcode"></span>
</p>


<p>
Item:
<span id="item"></span>
</p>


<p>
Price:
<span id="price"></span>
</p>


</div>



<button id="scanAgain" class="hidden">
🔄 Scan Again
</button>



</div>


<script src="javascript.js"></script>


</body>

</html>
