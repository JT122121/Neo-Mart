<!DOCTYPE html>
<html>
<head>

<title>Neo Mart Scanner</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body {
    font-family: Arial;
    text-align:center;
    padding:20px;
}

h1 {
    font-size:28px;
}

button {
    padding:15px 30px;
    font-size:20px;
    border-radius:10px;
    border:0;
    background:#2196F3;
    color:white;
}

video {
    margin-top:20px;
    width:100%;
    max-width:500px;
    border-radius:15px;
}

#result {
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}

#box {
    border:3px solid red;
    width:300px;
    height:100px;
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    margin-top:180px;
    z-index:2;
}

</style>

</head>


<body>


<h1>Neo Mart Scanner</h1>


<button onclick="startScanner()">
📷 Start Scanner
</button>


<br>


<div id="box"></div>

<video id="video" autoplay playsinline></video>


<div id="result">
Waiting for barcode...
</div>



<script src="https://unpkg.com/@zxing/library@latest"></script>

<script src="javascript.js"></script>


</body>
</html>
